# Render Blueprint: one free Node web service that serves the web client and the WebSocket game server.
services:
  - type: web
    name: kitchen-chaos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
